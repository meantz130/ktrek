<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>국토대장정 트래커</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --sidebar-bg: #1e293b;
            --border: #e2e8f0;
            --white: #ffffff;
            --sidebar-width: 300px;
            --header-height: 60px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Pretendard', sans-serif; 
            margin: 0; background: var(--bg); color: #1e293b; 
            height: 100vh; display: flex; overflow: hidden;
        }

        /* 사이드바 */
        #sidebar {
            position: fixed; left: 0; top: 0; width: var(--sidebar-width); height: 100%;
            background: var(--sidebar-bg); color: white; z-index: 1001;
            display: flex; flex-direction: column; transition: transform 0.3s ease;
        }
        .sidebar-header { padding: 25px 20px 10px; font-weight: 700; font-size: 1.1rem; }
        .new-btn { margin: 10px 20px; padding: 14px; background: var(--primary); border-radius: 12px; text-align: center; font-weight: 600; cursor: pointer; border: none; color: white; font-size: 1rem; }
        .menu-list { overflow-y: auto; flex: 1; padding: 0 15px 20px; }
        .menu-item { 
            padding: 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        }
        .menu-item .day-text { font-weight: 700; color: #60a5fa; font-size: 0.85rem; margin-bottom: 4px; }
        .menu-item .route-text { font-size: 0.95rem; font-weight: 500; margin-bottom: 4px; }

        /* 메인 컨텐츠 */
        .main-wrapper {
            flex: 1; display: flex; flex-direction: column;
            margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width));
            height: 100vh; transition: margin 0.3s ease;
        }
        header {
            height: var(--header-height); background: var(--white);
            display: flex; align-items: center; padding: 0 20px;
            border-bottom: 1px solid var(--border);
        }
        .menu-toggle { display: none; font-size: 24px; cursor: pointer; margin-right: 10px; }
        main { flex: 1; overflow-y: auto; padding: 20px; max-width: 700px; margin: 0 auto; width: 100%; }

        .card { background: var(--white); border-radius: 24px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-size: 0.8rem; color: #64748b; margin: 0 0 6px 4px; font-weight: 600; }
        input, textarea { 
            width: 100%; padding: 14px; border: 1px solid var(--border); 
            border-radius: 14px; font-size: 16px;
        }
        textarea { height: 120px; resize: none; }

        /* 사진 영역 수정 */
        .photo-action-area { margin-bottom: 10px; }
        .btn-link-input { 
            background: #f1f5f9; border: 1px solid var(--border); padding: 10px; 
            border-radius: 10px; font-size: 0.9rem; cursor: pointer; width: 100%; text-align: left;
            color: #475569; font-weight: 500;
        }
        .img-container { margin-top: 10px; border-radius: 16px; overflow: hidden; display: none; background: #eee; }
        .img-container img { width: 100%; height: auto; display: block; }

        .btn-main { background: var(--primary); color: white; border: none; width: 100%; padding: 18px; border-radius: 16px; font-weight: 700; font-size: 1.05rem; margin-top: 15px; cursor: pointer; }
        .btn-delete { background: #fee2e2; color: #ef4444; border: none; width: 100%; padding: 14px; border-radius: 14px; margin-top: 10px; font-weight: 600; display: none; cursor: pointer; }

        @media (max-width: 767px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.active { transform: translateX(0); }
            .main-wrapper { margin-left: 0; width: 100%; }
            .menu-toggle { display: block; }
        }
    </style>
</head>
<body>

<nav id="sidebar">
    <div class="sidebar-header">나의 대장정 목록</div>
    <button class="new-btn" onclick="initForm()">+ 새로운 하루 기록</button>
    <div id="menuList" class="menu-list"></div>
</nav>

<div class="main-wrapper">
    <header>
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
        <div style="font-weight: 800; font-size: 1.1rem;">국토대장정 로그</div>
    </header>

    <main>
        <div class="card">
            <h2 id="viewTitle" style="color: var(--primary); margin-top: 0;">새로운 여정 기록</h2>
            <div class="input-grid">
                <div><label>날짜</label><input type="date" id="dateInput"></div>
                <div><label>일차</label><input type="number" id="day" placeholder="예: 1"></div>
                <div><label>출발지</label><input type="text" id="startPos"></div>
                <div><label>도착지</label><input type="text" id="endPos"></div>
                <div><label>이동 거리(km)</label><input type="number" id="distance" step="0.1"></div>
                <div><label>소요 시간</label><input type="text" id="duration"></div>
                
                <div class="full">
                    <label>오늘의 사진</label>
                    <div class="photo-action-area">
                        <button class="btn-link-input" onclick="inputPhotoUrl()">📸 사진 링크 입력 또는 수정하기...</button>
                        <input type="hidden" id="photoUrl">
                    </div>
                    <div class="img-container" id="previewArea">
                        <img id="previewImg" src="">
                    </div>
                </div>

                <div class="full"><label>오늘의 메모</label><textarea id="memo" placeholder="오늘의 추억을 적어주세요."></textarea></div>
                
                <div class="full" style="margin-top: 10px; border-top: 1px dashed #eee; padding-top: 20px;">
                    <label>관리자 인증 키</label>
                    <input type="password" id="adminPw" placeholder="수정/삭제용 비밀번호">
                </div>
            </div>

            <button class="btn-main" id="submitBtn" onclick="saveData()">오늘 기록 저장하기</button>
            <button class="btn-delete" id="deleteBtn" onclick="deleteData()">기록 삭제하기</button>
        </div>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBQaElZXd6gm2wyxTCRg2UMVyntRZAJCNI",
        authDomain: "ktrek-a1779.firebaseapp.com",
        databaseURL: "https://ktrek-a1779-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "ktrek-a1779",
        storageBucket: "ktrek-a1779.firebasestorage.app",
        messagingSenderId: "935801480500",
        appId: "1:935801480500:web:3af4137193b9df9a71f161"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const logsRef = ref(db, 'trekking_logs');
    
    let currentKey = null;

    // 요일 계산 함수
    function getWeekDay(dateStr) {
        if(!dateStr) return "";
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const date = new Date(dateStr);
        return days[date.getDay()];
    }

    // 사진 링크 입력 창
    window.inputPhotoUrl = () => {
        const current = document.getElementById('photoUrl').value;
        const url = prompt("이미지 주소(URL)를 입력해주세요:", current);
        if (url !== null) {
            document.getElementById('photoUrl').value = url;
            updatePreview(url);
        }
    };

    function updatePreview(url) {
        const area = document.getElementById('previewArea');
        const img = document.getElementById('previewImg');
        if (url && url.trim() !== "") {
            img.src = url;
            area.style.display = "block";
        } else {
            area.style.display = "none";
        }
    }

    window.toggleMenu = () => {
        document.getElementById('sidebar').classList.toggle('active');
    };

    window.initForm = () => {
        currentKey = null;
        document.getElementById('viewTitle').innerText = "새로운 여정 기록";
        document.querySelectorAll('input, textarea').forEach(el => {
            if(el.id !== 'adminPw') el.value = "";
        });
        document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
        document.getElementById('previewArea').style.display = "none";
        document.getElementById('adminPw').value = "";
        document.getElementById('submitBtn').innerText = "오늘 기록 저장하기";
        document.getElementById('deleteBtn').style.display = "none";
        if (window.innerWidth < 768) document.getElementById('sidebar').classList.remove('active');
    };

    window.saveData = () => {
        const day = document.getElementById('day').value;
        const date = document.getElementById('dateInput').value;
        const pw = document.getElementById('adminPw').value;
        
        if(!day || !date) return alert("날짜와 일차를 입력해주세요!");
        if(!pw) return alert("관리자 인증 키를 입력해주세요!");

        const data = {
            date: date,
            day: day,
            startPos: document.getElementById('startPos').value,
            endPos: document.getElementById('endPos').value,
            distance: document.getElementById('distance').value,
            duration: document.getElementById('duration').value,
            photoUrl: document.getElementById('photoUrl').value,
            memo: document.getElementById('memo').value,
            pw: pw
        };

        if(currentKey) {
            update(ref(db, `trekking_logs/${currentKey}`), data)
                .then(() => {
                    alert("수정되었습니다.");
                    document.getElementById('adminPw').value = ""; // 비밀번호 초기화
                })
                .catch(() => alert("인증 실패 또는 오류"));
        } else {
            push(logsRef, data).then(() => {
                alert("저장되었습니다.");
                initForm();
            });
        }
    };

    window.deleteData = () => {
        const pw = document.getElementById('adminPw').value;
        if(!pw) return alert("비밀번호가 필요합니다.");
        if(confirm("정말 삭제할까요?") && currentKey) {
            remove(ref(db, `trekking_logs/${currentKey}`))
                .then(() => { alert("삭제됨"); initForm(); })
                .catch(() => alert("인증 실패"));
        }
    };

    onValue(logsRef, (snapshot) => {
        const list = document.getElementById('menuList');
        list.innerHTML = "";
        const data = snapshot.val();
        if(data) {
            Object.entries(data).sort((a,b) => b[1].day - a[1].day).forEach(([key, val]) => {
                const item = document.createElement('div');
                item.className = 'menu-item';
                const dateObj = new Date(val.date);
                const dateText = `${dateObj.getMonth()+1}월 ${dateObj.getDate()}일(${getWeekDay(val.date)})`;
                
                item.innerHTML = `
                    <div class="day-text">${dateText} - ${val.day}일차</div>
                    <div class="route-text">${val.startPos || '?'} → ${val.endPos || '?'}</div>
                `;
                item.onclick = () => {
                    currentKey = key;
                    document.getElementById('viewTitle').innerText = `${val.day}일차 수정`;
                    document.getElementById('dateInput').value = val.date;
                    document.getElementById('day').value = val.day;
                    document.getElementById('startPos').value = val.startPos;
                    document.getElementById('endPos').value = val.endPos;
                    document.getElementById('distance').value = val.distance;
                    document.getElementById('duration').value = val.duration;
                    document.getElementById('photoUrl').value = val.photoUrl || "";
                    document.getElementById('memo').value = val.memo;
                    document.getElementById('adminPw').value = "";
                    updatePreview(val.photoUrl);
                    document.getElementById('submitBtn').innerText = "기록 수정 완료하기";
                    document.getElementById('deleteBtn').style.display = "block";
                    if (window.innerWidth < 768) toggleMenu();
                };
                list.appendChild(item);
            });
        }
    });

    initForm();
</script>
</body>
</html>
